# OpenClaw NATS Node 1 — dev cluster (3-node, R=3)
# Client: 4222  Cluster: 6222  Monitor: 8222
# Template — rendered by install.sh to ~/.openclaw/config/nats-1.conf

server_name: openclaw-nats-1

listen: 127.0.0.1:4222

http: 127.0.0.1:8222

# Auth policy lives in its own file (Phase 7): token mode or per-node nkeys,
# rendered by bin/nats-auth-render.mjs into the same directory as this file and
# re-rendered + reloaded by `openclaw-trust-peer --sync-nats` without touching
# the routes below. Relative includes resolve against this file's directory.
include "nats-auth.conf"

jetstream {
  store_dir: ${HOME}/.openclaw/nats/jetstream-1
  max_mem: 256MB
  max_file: 1GB
}

cluster {
  name: openclaw-cluster
  listen: 127.0.0.1:6222
  routes = [
    nats-route://127.0.0.1:6223
    nats-route://127.0.0.1:6224
  ]
}
